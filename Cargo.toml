[package]
name = "vram-supply-agent"
version = "0.1.8"
edition = "2021"
description = "vram.supply provider agent — connect your model inference node to the marketplace"
license = "Apache-2.0"

[[bin]]
name = "vramsupply"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
anyhow = "1"
urlencoding = "2"
dirs = "6"
libc = "0.2"
tokio-util = "0.7"

# WebSocket relay dependencies
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
rustls = "0.22"
tokio-rustls = "0.25" 
rustls-native-certs = "0.7"
http = "1.0"
url = "2.5"
bytes = "1.5"
regex = "1.10"
thiserror = "1.0"
base64 = "0.22"
shlex = "1.3.0"

[dev-dependencies]
tempfile = "3.24.0"
